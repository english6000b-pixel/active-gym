  <style>
    /* ==========================================================================
       ACTIVE GYM — CUSTOM VISUAL IDENTITY, LED MOTIFS & ANGULAR DIVIDERS
       ========================================================================== */
    :root {
      --bg-primary: #0B0B0C;
      --bg-surface: #151517;
      --accent-red: #E10613;
      --accent-bright: #FF1E27;
      --text-secondary: #9A9AA2;
    }

    body {
      background-color: var(--bg-primary);
      color: #FFFFFF;
      overflow-x: hidden;
    }

    /* Typography switching based on document direction/language */
    html[lang="ar"] body {
      font-family: 'Cairo', sans-serif;
    }
    html[lang="en"] body {
      font-family: 'Inter', sans-serif;
    }
    html[lang="en"] .heading-display {
      font-family: 'Bebas Neue', 'Oswald', sans-serif;
      letter-spacing: 0.04em;
    }
    html[lang="ar"] .heading-display {
      font-family: 'Cairo', sans-serif;
      font-weight: 900;
      letter-spacing: -0.01em;
    }

    /* Subtle Matte Carbon / Noise Texture Overlay */
    .carbon-bg {
      background-color: #0B0B0C;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(225, 6, 19, 0.14) 0%, transparent 55%),
        linear-gradient(45deg, rgba(255, 255, 255, 0.015) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255, 255, 255, 0.015) 25%, transparent 25%);
      background-size: 100% 100%, 24px 24px, 24px 24px;
    }

    /* Racing Red Gradient & Neon Glow Utilities */
    .btn-racing {
      background: linear-gradient(135deg, #E10613 0%, #FF1E27 100%);
      box-shadow: 0 0 22px rgba(225, 6, 19, 0.45);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .btn-racing:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 34px rgba(255, 30, 39, 0.75);
    }

    .neon-red-border {
      border: 1px solid rgba(255, 30, 39, 0.7);
      box-shadow: 0 0 28px rgba(225, 6, 19, 0.28), inset 0 0 18px rgba(225, 6, 19, 0.12);
    }

    .neon-text-glow {
      text-shadow: 0 0 24px rgba(225, 6, 19, 0.65);
    }

    .card-hover-glow {
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .card-hover-glow:hover {
      transform: translateY(-5px);
      border-color: rgba(255, 30, 39, 0.65);
      box-shadow: 0 14px 36px -10px rgba(225, 6, 19, 0.32);
    }

    /* Geometric LED Ceiling Light Motif (Squares & Diamonds) */
    .led-grid-pattern {
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 64px 64px;
    }

    .led-diamond {
      transform: rotate(45deg);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 0 18px rgba(225, 6, 19, 0.35), inset 0 0 14px rgba(225, 6, 19, 0.25);
    }
    .led-diamond-red {
      transform: rotate(45deg);
      border: 1.5px solid #FF1E27;
      box-shadow: 0 0 25px rgba(255, 30, 39, 0.6), inset 0 0 18px rgba(225, 6, 19, 0.35);
    }

    /* Angular Diagonal Section Dividers */
    .clip-angle-bottom {
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 36px), 0 100%);
    }
    .clip-angle-top {
      clip-path: polygon(0 36px, 100% 0, 100% 100%, 0 100%);
    }
    .clip-angle-both {
      clip-path: polygon(0 32px, 100% 0, 100% calc(100% - 32px), 0 100%);
    }

    /* Scroll Reveal Animation */
    .reveal {
      opacity: 0;
      transform: translateY(26px);
      transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Dark Stylized Google Map Filter */
    .dark-map-iframe {
      filter: invert(92%) hue-rotate(180deg) contrast(95%) saturate(85%);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0B0B0C;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272A;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #E10613;
    }

    /* Focus Accessibility */
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid #FF1E27;
      outline-offset: 3px;
    }
  </style>

    // ========================================================================
    // TESTIMONIALS CAROUSEL LOGIC
    // ========================================================================
    function renderTestimonialSlide() {
      const items = SITE_CONFIG.copy[currentLang].testimonials.items;
      const item = items[testimonialIndex % items.length];
      document.getElementById('testimonial-quote').textContent = `"${item.quote}"`;
      document.getElementById('testimonial-author').textContent = item.author;
      document.getElementById('testimonial-role').textContent = item.role;

      document.getElementById('testimonial-dots').innerHTML = items.map((_, i) => `
        <button
          type="button"
          onclick="goToTestimonial(${i})"
          aria-label="Slide ${i + 1}"
          class="h-2.5 rounded-full transition-all ${i === testimonialIndex ? 'w-8 bg-racingBright' : 'w-2.5 bg-white/25 hover:bg-white/50'}"
        ></button>
      `).join('');
    }

    function goToTestimonial(idx) {
      testimonialIndex = idx;
      renderTestimonialSlide();
    }

    // ========================================================================
    // LIGHTBOX GALLERY LOGIC
    // ========================================================================
    function openLightbox(index) {
      lightboxIndex = index;
      updateLightboxContent();
      const modal = document.getElementById('lightbox-modal');
      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      const modal = document.getElementById('lightbox-modal');
      modal.classList.add('hidden');
      document.getElementById('lightbox-media-container').innerHTML = '';
      document.body.style.overflow = '';
    }

    function updateLightboxContent() {
      const item = lightboxItems[lightboxIndex];
      const container = document.getElementById('lightbox-media-container');
      const caption = item[currentLang];

      if (item.type === 'video') {
        container.innerHTML = `
          <video controls autoplay playsinline class="w-full max-h-[72vh] bg-black">
            <source src="${item.src}" type="video/mp4" />
          </video>
        `;
      } else {
        container.innerHTML = `
          <img
            src="${item.src}"
            alt="${caption}"
            onerror="this.src='${SITE_CONFIG.assets.fallbackImg}'"
            class="w-full max-h-[72vh] object-contain"
          />
        `;
      }

      document.getElementById('lightbox-caption').textContent = caption;
      document.getElementById('lightbox-counter').textContent = `${lightboxIndex + 1} / ${lightboxItems.length}`;
    }

    // ========================================================================
    // ANIMATED COUNTERS & SCROLL REVEAL
    // ========================================================================
    function animateCounters() {
      if (statsAnimated) return;
      statsAnimated = true;

      document.querySelectorAll('.stat-number').forEach(el => {
        const target = parseInt(el.dataset.target, 10);
        const suffix = el.dataset.suffix || '';
        const textVal = el.dataset.text;
        if (textVal || isNaN(target)) return;

        const duration = 1600;
        const startTime = performance.now();

        function tick(now) {
          const progress = Math.min((now - startTime) / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          const current = Math.floor(eased * target);
          el.textContent = `${current}${suffix}`;
          if (progress < 1) {
            requestAnimationFrame(tick);
          } else {
            el.textContent = `${target}${suffix}`;
          }
        }
        requestAnimationFrame(tick);
      });
    }

    // ========================================================================
    // INITIALIZATION & EVENT LISTENERS
    // ========================================================================
    document.addEventListener('DOMContentLoaded', () => {
      // Set Hero Video & Poster from Config
      const heroVideo = document.getElementById('hero-video');
      heroVideo.poster = SITE_CONFIG.assets.heroPosterUrl;
      document.getElementById('hero-video-src').src = SITE_CONFIG.assets.heroVideoUrl;
      heroVideo.load();

      // Render Initial Language
      renderAll();

      // Language Toggle
      document.getElementById('lang-toggle').addEventListener('click', () => {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        renderAll();
      });

      // Mobile Menu Toggle
      const mobileBtn = document.getElementById('mobile-menu-btn');
      const mobileDrawer = document.getElementById('mobile-drawer');
      mobileBtn.addEventListener('click', () => {
        const isHidden = mobileDrawer.classList.toggle('hidden');
        mobileBtn.setAttribute('aria-expanded', String(!isHidden));
        document.getElementById('menu-icon-open').classList.toggle('hidden', !isHidden);
        document.getElementById('menu-icon-close').classList.toggle('hidden', isHidden);
      });

      // Sticky Header Shrink on Scroll & Subtle Hero Parallax
      const header = document.getElementById('main-header');
      const heroMedia = document.getElementById('hero-media-wrapper');
      window.addEventListener('scroll', () => {
        const scrollY = window.scrollY;
        if (scrollY > 40) {
          header.classList.add('py-2.5', 'bg-charcoal/95', 'shadow-xl');
          header.classList.remove('py-4', 'bg-charcoal/80');
        } else {
          header.classList.remove('py-2.5', 'bg-charcoal/95', 'shadow-xl');
          header.classList.add('py-4', 'bg-charcoal/80');
        }
        if (scrollY < window.innerHeight && heroMedia) {
          heroMedia.style.transform = `translateY(${scrollY * 0.25}px)`;
        }
      }, { passive: true });

      // Testimonials Navigation
      document.getElementById('testimonial-prev').addEventListener('click', () => {
        const len = SITE_CONFIG.copy[currentLang].testimonials.items.length;
        testimonialIndex = (testimonialIndex - 1 + len) % len;
        renderTestimonialSlide();
      });
      document.getElementById('testimonial-next').addEventListener('click', () => {
        const len = SITE_CONFIG.copy[currentLang].testimonials.items.length;
        testimonialIndex = (testimonialIndex + 1) % len;
        renderTestimonialSlide();
      });

      // Lightbox Controls & Keyboard Escape
      document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
      document.getElementById('lightbox-prev').addEventListener('click', () => {
        lightboxIndex = (lightboxIndex - 1 + lightboxItems.length) % lightboxItems.length;
        updateLightboxContent();
      });
      document.getElementById('lightbox-next').addEventListener('click', () => {
        lightboxIndex = (lightboxIndex + 1) % lightboxItems.length;
        updateLightboxContent();
      });
      document.getElementById('lightbox-modal').addEventListener('click', (e) => {
        if (e.target.id === 'lightbox-modal') closeLightbox();
      });
      document.addEventListener('keydown', (e) => {
        const modal = document.getElementById('lightbox-modal');
        if (modal.classList.contains('hidden')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowRight') {
          lightboxIndex = (lightboxIndex + 1) % lightboxItems.length;
          updateLightboxContent();
        }
        if (e.key === 'ArrowLeft') {
          lightboxIndex = (lightboxIndex - 1 + lightboxItems.length) % lightboxItems.length;
          updateLightboxContent();
        }
      });

      // Quick WhatsApp Inquiry Form Submit
      document.getElementById('whatsapp-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('input-name').value.trim();
        const phone = document.getElementById('input-phone').value.trim();
        const msg = document.getElementById('input-message').value.trim();

        const formattedMessage = currentLang === 'ar'
          ? `مرحباً ACTIVE GYM!\nالاسم: ${name}\nرقم الهاتف: ${phone}\nالرسالة: ${msg}`
          : `Hello ACTIVE GYM!\nName: ${name}\nPhone: ${phone}\nMessage: ${msg}`;

        window.open(buildWhatsAppUrl(formattedMessage), '_blank', 'noopener,noreferrer');
      });

      // IntersectionObserver for Scroll Reveal & Stats Counter Trigger
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            if (entry.target.id === 'stats') {
              animateCounters();
            }
          }
        });
      }, { threshold: 0.15 });

      document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
      const statsSection = document.getElementById('stats');
      if (statsSection) observer.observe(statsSection);
    });
  </script>
</body>
</html>
